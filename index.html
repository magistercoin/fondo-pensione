<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisi Gratuita Fondo Pensione | Stefano Camossi</title>
  
  <!-- Brevo Form CSS -->
  <link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-forms.css">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --bg-light: #f8fafc;
      --text-main: #334155;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px 10px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Stili Modulo Brevo */
    .sib-form {
      padding: 0 !important;
      background: transparent !important;
    }

    .sib-form-block {
      margin-bottom: 16px !important;
      padding: 0 !important;
    }

    .entry__label {
      font-weight: 600 !important;
      color: var(--text-main) !important;
      font-size: 0.95rem !important;
      margin-bottom: 6px !important;
      display: block !important;
    }

    .entry__field input[type="text"],
    .entry__field input[type="email"] {
      width: 100% !important;
      padding: 12px !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 6px !important;
      font-size: 0.95rem !important;
      outline: none;
      transition: border-color 0.2s;
    }

    .entry__field input:focus {
      border-color: var(--primary) !important;
    }

    .entry__specification {
      font-size: 0.8rem !important;
      color: var(--text-muted) !important;
      margin-top: 4px !important;
      display: block !important;
    }

    .checkbox__label {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      font-size: 0.9rem !important;
      color: var(--text-main) !important;
      cursor: pointer;
    }

    .sib-form-block__button {
      width: 100% !important;
      padding: 14px !important;
      background-color: var(--primary) !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 6px !important;
      font-weight: 700 !important;
      font-size: 1rem !important;
      cursor: pointer !important;
      transition: background-color 0.2s !important;
      margin-top: 10px !important;
    }

    .sib-form-block__button:hover {
      background-color: var(--primary-hover) !important;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Analisi Gratuita Fondo Pensione</h1>
      <p>Richiedi un'analisi indipendente e personalizzata per verificare l'efficienza e i costi del tuo fondo.</p>
    </header>

    <!-- FORM SECTION -->
    <div class="sib-form">
      <div id="sib-form-container" class="sib-form-container">

        <div id="sib-container">
          <form id="sib-form" method="POST" action="https://647fb00d.sibforms.com/serve/MUIFACTUt4IpBEihExCJWK7y2O3J_DbxCzXuIcr_N1Vm_e81drJPHDcMrGHMERfJYNx_SLuUi8iJHTtPIM9ObokGJbVTcoxiIgTDY5I5jt3mbr7u95QfmSpI21QUOn2vb0kEB40ru__mJzFxUttO7EE-zAcAHQ5QHs8shZSo_gKvRR9lxj7q2d9GvhdK3WKn-tR9X_HC8NHZ1qkKVg==">

            <!-- EMAIL -->
            <div class="sib-input sib-form-block">
              <div class="form__entry entry_block">
                <label class="entry__label" for="EMAIL">Inserisci la tua e-mail <span style="color:#ff4949;">*</span></label>
                <div class="entry__field">
                  <input class="input" type="email" id="EMAIL" name="EMAIL" placeholder="es. mario.rossi@email.it" required />
                </div>
                <label class="entry__specification">Tutti i dati inviati sono strettamente confidenziali.</label>
              </div>
            </div>

            <!-- NOME FONDO -->
            <div class="sib-input sib-form-block">
              <div class="form__entry entry_block">
                <label class="entry__label" for="NOME_FONDO_PENSIONE">Nome del tuo Fondo Pensione <span style="color:#ff4949;">*</span></label>
                <div class="entry__field">
                  <input class="input" maxlength="200" type="text" id="NOME_FONDO_PENSIONE" name="NOME_FONDO_PENSIONE" placeholder="es. Amundi SecondaPensione, Fonchim, ecc." required />
                </div>
              </div>
            </div>

            <!-- COMPARTO -->
            <div class="sib-input sib-form-block">
              <div class="form__entry entry_block">
                <label class="entry__label" for="COMPARTO_FONDO_PENSIONE">Comparto della linea (se conosciuto) <span style="color:#ff4949;">*</span></label>
                <div class="entry__field">
                  <input class="input" maxlength="200" type="text" id="COMPARTO_FONDO_PENSIONE" name="COMPARTO_FONDO_PENSIONE" placeholder="es. Espansione, Azionario, Bilanciato..." required />
                </div>
              </div>
            </div>

            <!-- NUMERO ALBO -->
            <div class="sib-input sib-form-block">
              <div class="form__entry entry_block">
                <label class="entry__label" for="NUMERO_ALBO_FONDO_PENSIONE">Numero Albo Fondo Pensione (opzionale)</label>
                <div class="entry__field">
                  <input class="input" maxlength="200" type="text" id="NUMERO_ALBO_FONDO_PENSIONE" name="NUMERO_ALBO_FONDO_PENSIONE" placeholder="es. 5042" />
                </div>
                <label class="entry__specification">Utile per individuare con certezza assoluta il fondo da analizzare.</label>
              </div>
            </div>

            <!-- PATRIMONIO -->
            <div class="sib-checkbox-group sib-form-block">
              <div class="form__entry entry_mcq">
                <label class="entry__label">Patrimonio Personale Indicativo <span style="color:#ff4949;">*</span></label>
                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;">
                  <div class="entry__choice">
                    <label class="checkbox__label">
                      <input type="radio" name="PATRIMONIO_FINANZIARIO" value="&lt;100.000" required />
                      <span>Meno di 100.000 €</span>
                    </label>
                  </div>
                  <div class="entry__choice">
                    <label class="checkbox__label">
                      <input type="radio" name="PATRIMONIO_FINANZIARIO" value="100.000-300.000" required />
                      <span>Tra 100.000 € e 300.000 €</span>
                    </label>
                  </div>
                  <div class="entry__choice">
                    <label class="checkbox__label">
                      <input type="radio" name="PATRIMONIO_FINANZIARIO" value="300.000-1.000.000" required />
                      <span>Tra 300.000 € e 1.000.000 €</span>
                    </label>
                  </div>
                  <div class="entry__choice">
                    <label class="checkbox__label">
                      <input type="radio" name="PATRIMONIO_FINANZIARIO" value="&gt;1.000.000" required />
                      <span>Oltre 1.000.000 €</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>

            <!-- PRIVACY -->
            <div class="sib-optin sib-form-block" style="margin-top: 15px;">
              <div class="form__entry entry_mcq">
                <div class="entry__choice">
                  <label class="checkbox__label" style="align-items: flex-start;">
                    <input type="checkbox" value="1" id="ACCETTAZIONE_PRIVACY" name="ACCETTAZIONE_PRIVACY" required style="margin-top: 3px;" />
                    <span style="font-size: 0.85rem;">
                      Accetto le condizioni generali e di ricevere comunicazioni da Stefano Camossi, Consulente Finanziario Autonomo.
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <!-- BOTTONE INVIO -->
            <div class="sib-form-block">
              <button class="sib-form-block__button" type="submit">
                RICHIEDI L'ANALISI GRATUITA (MAX 5/MESE)
              </button>
            </div>

            <input type="text" name="email_address_check" value="" style="display:none;">
            <input type="hidden" name="locale" value="it">

          </form>
        </div>
      </div>
    </div>

    <footer>
      <p>Acconsento al trattamento dei dati in conformità alla <a href="https://taplink.at/it/profile/18048995/pages/" target="_blank" rel="nofollow">Privacy Policy</a>.</p>
      <p>Servizio erogato da Stefano Camossi - Consulente Finanziario Autonomo.</p>
    </footer>
  </div>

  <!-- SCRIPT DI BREVO PER GESTIRE L'INVIO E IL REINDIRIZZAMENTO -->
  <script>
    window.REQUIRED_CODE_ERROR_MESSAGE = 'Scegli un codice paese';
    window.LOCALE = 'it';
    window.EMAIL_INVALID_MESSAGE = 'Inserisci un indirizzo e-mail valido.';
    window.REQUIRED_ERROR_MESSAGE = 'Questo campo non può essere lasciato vuoto.';
    window.GENERIC_SUCCESS_MESSAGE = 'Iscrizione completata con successo.';
    window.translation = {
      common: {
        selectedList: '{count} lista selezionata',
        selectedLists: '{count} liste selezionate'
      }
    };
  </script>
  <script src="https://sibforms.com/forms/end-form/build/main.js" defer></script>

</body>
</html>
